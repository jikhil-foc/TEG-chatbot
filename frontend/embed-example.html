<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEG Chatbot Embed Example</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      main {
        width: 100%;
        height: 100%;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <iframe
        src="/teg-site/"
        title="TEG – Teastas Eorpach na Gaeilge"
        loading="eager"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </main>

    <script
      src="./dist/widget/teg-chatbot.js"
      data-auto-init
      data-api-url="http://localhost:8000"
      data-title="TEG Assistant"
      data-subtitle="Ask about TEG levels and exams"
    ></script>
  </body>
</html>
